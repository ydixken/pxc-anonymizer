{{- if .Values.rbac.create }}
{{- /* Generated by hack/sync-chart-rbac.sh from config/rbac/role.yaml. */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "pxc-anonymizer.fullname" . }}-manager
  labels:
    {{- include "pxc-anonymizer.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - secrets
