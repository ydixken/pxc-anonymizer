{{- if .Values.crds.install }}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
    {{- if .Values.crds.keep }}
    helm.sh/resource-policy: keep
    {{- end }}
  name: anonymizationpolicies.pxc-anonymizer.io
spec:
  group: pxc-anonymizer.io
  names:
    kind: AnonymizationPolicy
    listKind: AnonymizationPolicyList
    plural: anonymizationpolicies
    shortNames:
    - apol
    singular: anonymizationpolicy
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: AnonymizationPolicy defines reusable transformations without
          embedding SQL bodies.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of AnonymizationPolicy
            properties:
              databases:
                description: Pattern-only entries have no name to use as a required
                  map key.
                items:
                  description: DatabasePolicy can match an exact database or an anchored
                    RE2 expression.
                  properties:
                    name:
                      pattern: ^[A-Za-z0-9_$]{1,64}$
                      type: string
                    namePattern:
                      description: Pattern compilation belongs to policy validation,
                        before a Run starts.
                      type: string
                    optional:
                      description: Missing databases or zero pattern matches fail
                        unless this is true.
                      type: boolean
                    post:
                      items:
                        description: StepRef preserves the declared execution order
                          of reusable SQL steps.
                        properties:
                          name:
                            type: string
                        required:
                        - name
                        type: object
                      type: array
                    pre:
                      items:
                        description: StepRef preserves the declared execution order
                          of reusable SQL steps.
                        properties:
                          name:
                            type: string
                        required:
                        - name
                        type: object
                      type: array
                    tables:
                      items:
                        description: TablePolicy allows a table to be truncated without
                          carrying column rules.
                        properties:
                          action:
                            default: Anonymize
                            description: TableAction separates row transformations
                              from whole-table removal.
                            enum:
                            - Anonymize
                            - Truncate
                            type: string
                          columns:
                            items:
                              description: ColumnRule leaves unspecified behavior
                                to policy and strategy defaults.
                              properties:
                                consistent:
                                  description: A true override makes equal inputs
                                    share outputs across tables within the Run.
                                  type: boolean
                                name:
                                  type: string
                                onEmpty:
                                  description: ValueHandling preserves null or empty
                                    inputs unless generation is requested.
                                  enum:
                                  - Keep
                                  - Generate
                                  type: string
                                onNull:
                                  description: ValueHandling preserves null or empty
                                    inputs unless generation is requested.
                                  enum:
                                  - Keep
                                  - Generate
                                  type: string
                                params:
                                  description: StrategyParams keeps optional values
                                    distinguishable from explicit zero or empty values.
                                  properties:
                                    ascii:
                                      default: true
                                      type: boolean
                                    case:
                                      enum:
                                      - Mixed
                                      - Upper
                                      - Lower
                                      type: string
                                    country:
                                      default: DE
                                      type: string
                                    digits:
                                      default: 15
                                      description: Digits limits phone numbers to
                                        their supported maximum length.
                                      format: int32
                                      maximum: 15
                                      type: integer
                                    domain:
                                      description: Domain falls back to the policy
                                        default, then the email generator.
                                      type: string
                                    encoding:
                                      enum:
                                      - hex
                                      - base64
                                      type: string
                                    format:
                                      enum:
                                      - date
                                      - datetime
                                      type: string
                                    from:
                                      default: "1950-01-01"
                                      type: string
                                    keepPrefix:
                                      format: int32
                                      type: integer
                                    keepSuffix:
                                      format: int32
                                      type: integer
                                    length:
                                      description: Hash uses 64 when omitted; alphanumeric
                                        and digits require an explicit value.
                                      format: int32
                                      type: integer
                                    locale:
                                      description: Locale falls back to the policy
                                        default.
                                      type: string
                                    maskChar:
                                      type: string
                                    max:
                                      format: int64
                                      type: integer
                                    maxLength:
                                      format: int32
                                      type: integer
                                    min:
                                      format: int64
                                      type: integer
                                    sentences:
                                      format: int32
                                      type: integer
                                    to:
                                      description: The date generator evaluates an
                                        omitted upper bound as today at execution
                                        time.
                                      type: string
                                    unique:
                                      description: Unique requests collision retries
                                        for the digits strategy.
                                      type: boolean
                                    value:
                                      description: A pointer preserves an intentionally
                                        empty constant.
                                      type: string
                                    valueFrom:
                                      description: ValueFrom keeps sensitive constants
                                        in a Secret in the policy's namespace.
                                      properties:
                                        key:
                                          description: The key of the secret to select
                                            from.  Must be a valid secret key.
                                          type: string
                                        name:
                                          default: ""
                                          description: |-
                                            Name of the referent.
                                            This field is effectively required, but due to backwards compatibility is
                                            allowed to be empty. Instances of this type with an empty value here are
                                            almost certainly wrong.
                                            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                          type: string
                                        optional:
                                          description: Specify whether the Secret
                                            or its key must be defined
                                          type: boolean
                                      required:
                                      - key
                                      type: object
                                      x-kubernetes-map-type: atomic
                                  type: object
                                strategy:
                                  description: Strategy rejects misspelled transformations
                                    before a Run starts.
                                  enum:
                                  - firstName
                                  - lastName
                                  - fullName
                                  - jobTitle
                                  - email
                                  - phone
                                  - date
                                  - address
                                  - streetAddress
                                  - streetSuffix
                                  - city
                                  - postalCode
                                  - state
                                  - country
                                  - company
                                  - companySuffix
                                  - vatId
                                  - iban
                                  - ipv4Public
                                  - url
                                  - uuid
                                  - alphanumeric
                                  - digits
                                  - number
                                  - text
                                  - constant
                                  - hash
                                  - mask
                                  - "null"
                                  type: string
                              required:
                              - name
                              - strategy
                              type: object
                              x-kubernetes-validations:
                              - message: alphanumeric and digits require params.length
                                rule: 'self.strategy in [''alphanumeric'',''digits'']
                                  ? (has(self.params) && has(self.params.length))
                                  : true'
                              - message: constant requires params.value or params.valueFrom
                                rule: 'self.strategy == ''constant'' ? (has(self.params)
                                  && (has(self.params.value) || has(self.params.valueFrom)))
                                  : true'
                              - message: null, mask and constant do not accept consistent
                                rule: 'self.strategy in [''null'',''mask'',''constant'']
                                  ? !has(self.consistent) : true'
                              - message: params.length must not exceed 4096
                                rule: '!has(self.params) || !has(self.params.length)
                                  || self.params.length <= 4096'
                            type: array
                            x-kubernetes-list-map-keys:
                            - name
                            x-kubernetes-list-type: map
                          ignore:
                            description: IgnoreSpec excludes matching rows from a
                              table's transformation.
                            properties:
                              where:
                                description: Supply a WHERE expression without the
                                  keyword or a statement delimiter.
                                maxLength: 4096
                                pattern: ^[^;]*$
                                type: string
                            required:
                            - where
                            type: object
                          name:
                            type: string
                          optional:
                            type: boolean
                          pageSize:
                            format: int32
                            maximum: 50000
                            type: integer
                          primaryKey:
                            description: Omission selects the table's primary key;
                              an override permits a unique index instead.
                            items:
                              type: string
                            type: array
                        required:
                        - name
                        type: object
                        x-kubernetes-validations:
                        - message: Truncate takes no columns
                          rule: self.action != 'Truncate' || !has(self.columns)
                        - message: Anonymize needs at least one column
                          rule: self.action != 'Anonymize' || (has(self.columns) &&
                            size(self.columns) > 0)
                      type: array
                      x-kubernetes-list-map-keys:
                      - name
                      x-kubernetes-list-type: map
                  type: object
                  x-kubernetes-validations:
                  - message: set exactly one of name or namePattern
                    rule: '(has(self.name) ? 1 : 0) + (has(self.namePattern) ? 1 :
                      0) == 1'
                minItems: 1
                type: array
                x-kubernetes-list-type: atomic
              defaults:
                default: {}
                description: PolicyDefaults supplies values inherited by tables and
                  columns when they omit an override.
                properties:
                  emailDomain:
                    description: An omitted domain lets the generator select one.
                    type: string
                  locale:
                    default: en
                    type: string
                  onEmpty:
                    default: Keep
                    description: ValueHandling preserves null or empty inputs unless
                      generation is requested.
                    enum:
                    - Keep
                    - Generate
                    type: string
                  onNull:
                    default: Keep
                    description: ValueHandling preserves null or empty inputs unless
                      generation is requested.
                    enum:
                    - Keep
                    - Generate
                    type: string
                  pageSize:
                    default: 5000
                    format: int32
                    maximum: 50000
                    type: integer
                type: object
              determinism:
                default: {}
                description: DeterminismSpec defaults to unlinkable identities between
                  Runs.
                properties:
                  mode:
                    default: PerRun
                    description: Fixed mode reuses the referenced seed for stable
                      identities across refreshes.
                    enum:
                    - PerRun
                    - Fixed
                    type: string
                  seedSecretRef:
                    description: SecretKeySelector selects a key of a Secret.
                    properties:
                      key:
                        description: The key of the secret to select from.  Must be
                          a valid secret key.
                        type: string
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                      optional:
                        description: Specify whether the Secret or its key must be
                          defined
                        type: boolean
                    required:
                    - key
                    type: object
                    x-kubernetes-map-type: atomic
                type: object
                x-kubernetes-validations:
                - message: Fixed determinism requires seedSecretRef
                  rule: '!has(self.mode) || self.mode != ''Fixed'' || has(self.seedSecretRef)'
              steps:
                description: SQL stays in referenced objects so credentials never
                  need to be embedded in this policy.
                items:
                  description: SQLStep uses references so sensitive SQL can be carried
                    by a Secret.
                  properties:
                    configMapKeyRef:
                      description: Selects a key from a ConfigMap.
                      properties:
                        key:
                          description: The key to select.
                          type: string
                        name:
                          default: ""
                          description: |-
                            Name of the referent.
                            This field is effectively required, but due to backwards compatibility is
                            allowed to be empty. Instances of this type with an empty value here are
                            almost certainly wrong.
                            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                          type: string
                        optional:
                          description: Specify whether the ConfigMap or its key must
                            be defined
                          type: boolean
                      required:
                      - key
                      type: object
                      x-kubernetes-map-type: atomic
                    continueOnError:
                      description: Failures stop the Run unless continuing was explicitly
                        requested.
                      type: boolean
                    name:
                      pattern: ^[a-z0-9-]{1,63}$
                      type: string
                    secretKeyRef:
                      description: SecretKeySelector selects a key of a Secret.
                      properties:
                        key:
                          description: The key of the secret to select from.  Must
                            be a valid secret key.
                          type: string
                        name:
                          default: ""
                          description: |-
                            Name of the referent.
                            This field is effectively required, but due to backwards compatibility is
                            allowed to be empty. Instances of this type with an empty value here are
                            almost certainly wrong.
                            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                          type: string
                        optional:
                          description: Specify whether the Secret or its key must
                            be defined
                          type: boolean
                      required:
                      - key
                      type: object
                      x-kubernetes-map-type: atomic
                  required:
                  - name
                  type: object
                  x-kubernetes-validations:
                  - message: set exactly one of configMapKeyRef or secretKeyRef
                    rule: '(has(self.configMapKeyRef) ? 1 : 0) + (has(self.secretKeyRef)
                      ? 1 : 0) == 1'
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
            required:
            - databases
            type: object
          status:
            description: status defines the observed state of AnonymizationPolicy
            properties:
              conditions:
                description: Valid reports SpecValid, StepRefMissing or PatternInvalid.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              hash:
                description: Hash is the SHA-256 of canonical policy JSON, also recorded
                  on Runs.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
