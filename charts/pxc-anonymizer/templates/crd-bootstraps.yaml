                        format: int64
                        type: integer
                      timeout:
                        default: 30s
                        type: string
                      url:
                        type: string
                    required:
                    - url
                    type: object
                    x-kubernetes-validations:
                    - message: url must use https, or http with allowInsecure
                      rule: self.url.startsWith('https://') || (has(self.allowInsecure)
                        && self.allowInsecure && self.url.startsWith('http://'))
                  maxAge:
                    description: MaxAge checks pointer publishedAt; nil disables the
                      age check.
                    type: string
                  s3:
                    description: S3PointerSource identifies a pointer object read
                      with S3 credentials.
                    properties:
                      key:
                        pattern: ^[A-Za-z0-9._/-]{1,512}$
                        type: string
                      objectStorage:
                        description: ObjectStorageSpec configures access to one S3-compatible
