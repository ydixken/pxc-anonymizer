                        properties:
                          bucket:
                            description: Bucket names the bucket containing backups
                              or pointer objects.
                            pattern: ^[a-z0-9.-]{3,63}$
                            type: string
                          credentialsSecretRef:
                            description: CredentialsSecretRef refers to a Secret in
