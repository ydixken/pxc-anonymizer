                - targets
                type: object
              history:
                items:
                  description: BootstrapRunRecord retains the outcome of one completed
                    trigger.
                  properties:
                    completedAt:
                      format: date-time
                      type: string
                    destination:
                      type: string
                    outcome:
                      description: BootstrapPhase identifies the current stage of
                        a bootstrap operation.
                      enum:
                      - Pending
                      - WaitingForClusters
                      - ResolvingPointer
                      - PausingCrossplane
                      - Restoring
                      - ResumingCrossplane
                      - RecreatingCrossplane
                      - Completed
                      - Failed
                      type: string
                    startedAt:
                      format: date-time
                      type: string
                    trigger:
                      type: string
                  type: object
                maxItems: 5
                type: array
              observedGeneration:
                format: int64
                type: integer
              observedTrigger:
                type: string
              phase:
                description: BootstrapPhase identifies the current stage of a bootstrap
                  operation.
                enum:
                - Pending
                - WaitingForClusters
                - ResolvingPointer
                - PausingCrossplane
                - Restoring
                - ResumingCrossplane
                - RecreatingCrossplane
                - Completed
                - Failed
                type: string
              source:
                description: ResolvedSource records the source selected from a literal,
                  backup, or pointer.
                properties:
                  backupName:
                    type: string
                  destination:
                    type: string
                  pointerPublishedAt:
                    format: date-time
                    type: string
                  pointerSchemaVersion:
                    description: PointerSchemaVersion distinguishes legacy pointers
                      without a publication timestamp.
                    format: int32
                    type: integer
                  sourceCluster:
                    type: string
                type: object
              startedAt:
                format: date-time
                type: string
              targets:
                items:
                  description: BootstrapTargetStatus records the restore state of
                    one target cluster.
                  properties:
                    completedAt:
                      format: date-time
                      type: string
                    message:
                      type: string
                    pxcCluster:
                      type: string
                    restoreName:
                      type: string
                    startedAt:
                      format: date-time
                      type: string
                    state:
                      description: State mirrors the PXC restore state without importing
                        its Go API.
                      type: string
                  required:
                  - pxcCluster
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - pxcCluster
                x-kubernetes-list-type: map
              targetsSummary:
                description: TargetsSummary contains the completed/total count used
                  by the printer column.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
