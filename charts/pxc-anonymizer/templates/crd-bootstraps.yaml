{{- if .Values.crds.install }}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
    {{- if .Values.crds.keep }}
    helm.sh/resource-policy: keep
    {{- end }}
  name: bootstraps.pxc-anonymizer.io
spec:
  group: pxc-anonymizer.io
  names:
    kind: Bootstrap
    listKind: BootstrapList
    plural: bootstraps
    shortNames:
    - bs
    singular: bootstrap
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.source.destination
      name: Destination
      type: string
    - jsonPath: .status.targetsSummary
      name: Targets
      type: string
    - jsonPath: .status.conditions[?(@.type=='Complete')].status
      name: Complete
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Bootstrap restores a backup into existing PXC clusters in target
          order.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: BootstrapSpec restores one immutable source into an ordered
              set of clusters.
            properties:
              crossplane:
                description: Crossplane is left untouched when this field is omitted.
