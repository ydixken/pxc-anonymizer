                                  allowed to be empty. Instances of this type with an empty value here are
                                  almost certainly wrong.
                                  More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                type: string
                            type: object
                            x-kubernetes-map-type: atomic
                          endpointURL:
                            description: EndpointURL overrides the endpoint from the
                              credentials Secret.
                            type: string
                          keys:
                            description: Keys remaps the default credentials and endpoint
                              keys.
                            properties:
                              accessKeyID:
                                default: AWS_ACCESS_KEY_ID
                                type: string
                              endpointURL:
                                default: S3_ENDPOINT_URL
                                type: string
                              publicEndpointURL:
                                default: S3_PUBLIC_ENDPOINT_URL
                                type: string
                              secretAccessKey:
                                default: AWS_SECRET_ACCESS_KEY
                                type: string
                            type: object
                          pathStyle:
                            description: PathStyle leaves addressing-style selection
                              automatic when unset.
                            type: boolean
                          prefix:
                            description: Prefix scopes object keys within the bucket.
                            type: string
                            x-kubernetes-validations:
                            - message: prefix must not start with /
                              rule: '!self.startsWith(''/'')'
                          region:
                            default: auto
                            description: Region supplies the S3 signing region.
                            type: string
                          tls:
                            description: TLS customizes certificate verification for
                              this endpoint.
                            properties:
                              caSecretRef:
                                description: SecretKeySelector selects a key of a
                                  Secret.
                                properties:
                                  key:
                                    description: The key of the secret to select from.  Must
                                      be a valid secret key.
                                    type: string
                                  name:
                                    default: ""
                                    description: |-
                                      Name of the referent.
                                      This field is effectively required, but due to backwards compatibility is
                                      allowed to be empty. Instances of this type with an empty value here are
                                      almost certainly wrong.
                                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                    type: string
                                  optional:
                                    description: Specify whether the Secret or its
                                      key must be defined
                                    type: boolean
                                required:
                                - key
                                type: object
                                x-kubernetes-map-type: atomic
                              insecureSkipVerify:
                                default: false
                                type: boolean
                            type: object
                        required:
                        - bucket
                        type: object
                        x-kubernetes-validations:
                        - message: endpointURL or a credentials Secret carrying S3_ENDPOINT_URL
                            is required
                          rule: has(self.endpointURL) || has(self.credentialsSecretRef)
                    required:
                    - key
                    - objectStorage
                    type: object
                type: object
                x-kubernetes-validations:
                - message: pointer is immutable
                  rule: self == oldSelf
                - message: set exactly one of http, s3 or destination
                  rule: '(has(self.http) ? 1 : 0) + (has(self.s3) ? 1 : 0) + (has(self.destination)
                    ? 1 : 0) == 1'
              restore:
                description: Restore supplies credentials for inline backupSource.s3
                  restores.
                properties:
                  credentialsSecret:
                    description: CredentialsSecret names a Secret in the resource's
                      namespace with AWS credential keys.
                    type: string
                  endpointURL:
                    description: EndpointURL falls back to the endpoint carried in
                      the pointer when unset.
                    type: string
                  region:
                    default: auto
                    type: string
                  verifyTLS:
                    type: boolean
                required:
                - credentialsSecret
                type: object
              targets:
                description: Targets are restored in list order; duplicate cluster
                  identities are invalid.
                items:
                  description: BootstrapTarget configures one target cluster and optional
                    restore overrides.
                  properties:
                    containerOptions:
                      description: XtrabackupContainerOptions keeps backup and restore
                        arguments independently configurable.
                      properties:
                        xbcloud:
                          items:
                            type: string
                          type: array
                        xbstream:
                          items:
                            type: string
                          type: array
                        xtrabackup:
                          items:
                            type: string
                          type: array
                      type: object
                    pxcCluster:
                      minLength: 1
                      type: string
                    restore:
                      description: Restore overrides the shared credentials for this
                        target.
                      properties:
                        credentialsSecret:
                          description: CredentialsSecret names a Secret in the resource's
                            namespace with AWS credential keys.
                          type: string
                        endpointURL:
                          description: EndpointURL falls back to the endpoint carried
                            in the pointer when unset.
                          type: string
                        region:
                          default: auto
                          type: string
                        verifyTLS:
                          type: boolean
                      required:
                      - credentialsSecret
                      type: object
                  required:
                  - pxcCluster
                  type: object
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - pxcCluster
                x-kubernetes-list-type: map
              timeouts:
                default: {}
                description: BootstrapTimeouts bounds each stage; a zero clustersReady
                  duration is unbounded.
                properties:
                  clustersReady:
                    default: 0s
                    type: string
                  crossplane:
                    default: 15m
                    type: string
                  pointer:
                    default: 15m
                    type: string
                  restore:
                    default: 3h
                    description: Restore applies separately to each target.
                    type: string
                type: object
              trigger:
                description: Trigger re-arms a terminal Bootstrap when its value changes.
                type: string
            required:
            - pointer
            - restore
            - targets
            type: object
          status:
            description: BootstrapStatus records progress, touched resources and the
              last five outcomes.
            properties:
              completedAt:
                format: date-time
                type: string
              conditions:
                description: |-
                  Conditions include ClustersReady, PointerResolved, CrossplanePaused, Restored,
                  CrossplaneResumed, CrossplaneRecreated, Complete and Failed.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              crossplane:
                description: CrossplaneStatus records exactly which managed resources
                  were touched or remain pending.
                properties:
                  paused:
                    items:
                      description: CrossplaneObjectReference identifies a cluster-scoped
                        managed resource.
                      properties:
                        kind:
                          type: string
                        name:
                          type: string
                        uid:
                          description: |-
                            UID is a type that holds unique ID values, including UUIDs.  Because we
                            don't ONLY use UUIDs, this is an alias to string.  Being a type captures
                            intent and helps make sure that UIDs and names do not get conflated.
                          type: string
                      required:
                      - kind
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - kind
                    - name
                    x-kubernetes-list-type: map
                  pending:
                    items:
                      description: CrossplaneObjectReference identifies a cluster-scoped
                        managed resource.
                      properties:
                        kind:
                          type: string
                        name:
                          type: string
                        uid:
                          description: |-
                            UID is a type that holds unique ID values, including UUIDs.  Because we
                            don't ONLY use UUIDs, this is an alias to string.  Being a type captures
                            intent and helps make sure that UIDs and names do not get conflated.
                          type: string
                      required:
                      - kind
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - kind
                    - name
                    x-kubernetes-list-type: map
                  recreated:
                    items:
                      description: CrossplaneObjectReference identifies a cluster-scoped
                        managed resource.
                      properties:
                        kind:
                          type: string
                        name:
                          type: string
                        uid:
                          description: |-
                            UID is a type that holds unique ID values, including UUIDs.  Because we
                            don't ONLY use UUIDs, this is an alias to string.  Being a type captures
                            intent and helps make sure that UIDs and names do not get conflated.
                          type: string
                      required:
                      - kind
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - kind
                    - name
                    x-kubernetes-list-type: map
                  recreating:
                    items:
                      description: CrossplaneRecreation preserves the original UID
                        so reconciliation never deletes a replacement.
                      properties:
                        complete:
                          type: boolean
                        deletionObserved:
                          type: boolean
                        kind:
                          type: string
                        name:
                          type: string
                        uid:
                          description: |-
                            UID is a type that holds unique ID values, including UUIDs.  Because we
                            don't ONLY use UUIDs, this is an alias to string.  Being a type captures
                            intent and helps make sure that UIDs and names do not get conflated.
                          type: string
                      required:
                      - kind
                      - name
                      - uid
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - kind
                    - name
                    x-kubernetes-list-type: map
                  resumed:
                    items:
                      description: CrossplaneObjectReference identifies a cluster-scoped
                        managed resource.
                      properties:
                        kind:
                          type: string
                        name:
                          type: string
                        uid:
                          description: |-
                            UID is a type that holds unique ID values, including UUIDs.  Because we
                            don't ONLY use UUIDs, this is an alias to string.  Being a type captures
                            intent and helps make sure that UIDs and names do not get conflated.
                          type: string
                      required:
                      - kind
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - kind
                    - name
                    x-kubernetes-list-type: map
                type: object
              execution:
                description: BootstrapExecutionStatus freezes non-secret execution
                  inputs before external effects.
                properties:
                  crossplaneGroup:
                    type: string
                  crossplaneVersion:
                    type: string
                  id:
                    description: ID separates repeated executions when trigger values
                      are reused.
                    type: string
                  selected:
                    items:
                      description: CrossplaneObjectReference identifies a cluster-scoped
                        managed resource.
                      properties:
                        kind:
                          type: string
                        name:
                          type: string
                        uid:
                          description: |-
                            UID is a type that holds unique ID values, including UUIDs.  Because we
                            don't ONLY use UUIDs, this is an alias to string.  Being a type captures
                            intent and helps make sure that UIDs and names do not get conflated.
                          type: string
                      required:
                      - kind
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - kind
                    - name
                    x-kubernetes-list-type: map
                  specHash:
                    type: string
                  targets:
                    items:
                      description: BootstrapTargetExecution pins identity and restore
                        references across reconciliation restarts.
                      properties:
                        pxcCluster:
                          type: string
                        restore:
                          description: RestoreS3Credentials supplies the inline S3
                            fields needed by a PXC restore.
                          properties:
                            credentialsSecret:
                              description: CredentialsSecret names a Secret in the
                                resource's namespace with AWS credential keys.
                              type: string
                            endpointURL:
                              description: EndpointURL falls back to the endpoint
                                carried in the pointer when unset.
                              type: string
                            region:
                              default: auto
                              type: string
                            verifyTLS:
                              type: boolean
                          required:
