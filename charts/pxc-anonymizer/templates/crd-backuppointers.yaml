{{- if .Values.crds.install }}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
    {{- if .Values.crds.keep }}
    helm.sh/resource-policy: keep
    {{- end }}
  name: backuppointers.pxc-anonymizer.io
spec:
  group: pxc-anonymizer.io
  names:
    kind: BackupPointer
    listKind: BackupPointerList
    plural: backuppointers
    shortNames:
    - bp
    singular: backuppointer
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.source.pxcCluster
      name: Cluster
      type: string
    - jsonPath: .status.current.backupName
      name: Backup
      type: string
    - jsonPath: .status.current.publishedAt
      name: Published
      type: date
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=='Fresh')].status
      name: Fresh
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: BackupPointer publishes the latest successful backup as a reusable
          pointer.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: BackupPointerSpec selects backups to publish and controls
              pointer freshness.
            properties:
              source:
                description: Source cannot change after creation because it defines
                  the backup lineage.
                properties:
                  pxcCluster:
                    type: string
                  selector:
                    description: Selector further restricts backups by their labels.
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label selector
                          requirements. The requirements are ANDed.
                        items:
                          description: |-
                            A label selector requirement is a selector that contains values, a key, and an operator that
                            relates the key and values.
                          properties:
                            key:
                              description: key is the label key that the selector
                                applies to.
                              type: string
                            operator:
                              description: |-
                                operator represents a key's relationship to a set of values.
                                Valid operators are In, NotIn, Exists and DoesNotExist.
                              type: string
                            values:
                              description: |-
                                values is an array of string values. If the operator is In or NotIn,
                                the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                the values array must be empty. This array is replaced during a strategic
                                merge patch.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: atomic
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                          map is equivalent to an element of matchExpressions, whose key field is "key", the
                          operator is "In", and the values array contains only "value". The requirements are ANDed.
                        type: object
                    type: object
                    x-kubernetes-map-type: atomic
                  storageNames:
                    description: StorageNames permits any storage when the set is
                      empty.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                required:
                - pxcCluster
                type: object
                x-kubernetes-validations:
                - message: source is immutable
                  rule: self == oldSelf
              staleAfter:
                default: 36h
                description: StaleAfter measures freshness from the selected backup's
                  completion time.
                type: string
              suspend:
                description: Suspend pauses pointer reconciliation.
                type: boolean
              target:
                description: Target identifies where the selected backup's pointer
                  is published.
                properties:
                  key:
                    pattern: ^[A-Za-z0-9._/-]{1,512}$
                    type: string
                  objectStorage:
                    description: ObjectStorageSpec configures access to one S3-compatible
                      bucket.
                    properties:
                      bucket:
                        description: Bucket names the bucket containing backups or
                          pointer objects.
                        pattern: ^[a-z0-9.-]{3,63}$
                        type: string
                      credentialsSecretRef:
                        description: CredentialsSecretRef refers to a Secret in the
                          resource's namespace.
                        properties:
                          name:
                            default: ""
                            description: |-
                              Name of the referent.
                              This field is effectively required, but due to backwards compatibility is
                              allowed to be empty. Instances of this type with an empty value here are
                              almost certainly wrong.
                              More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                            type: string
                        type: object
                        x-kubernetes-map-type: atomic
                      endpointURL:
                        description: EndpointURL overrides the endpoint from the credentials
                          Secret.
                        type: string
                      keys:
                        description: Keys remaps the default credentials and endpoint
                          keys.
                        properties:
                          accessKeyID:
                            default: AWS_ACCESS_KEY_ID
                            type: string
                          endpointURL:
                            default: S3_ENDPOINT_URL
                            type: string
                          publicEndpointURL:
                            default: S3_PUBLIC_ENDPOINT_URL
                            type: string
                          secretAccessKey:
                            default: AWS_SECRET_ACCESS_KEY
                            type: string
                        type: object
                      pathStyle:
                        description: PathStyle leaves addressing-style selection automatic
                          when unset.
                        type: boolean
                      prefix:
                        description: Prefix scopes object keys within the bucket.
                        type: string
                        x-kubernetes-validations:
                        - message: prefix must not start with /
                          rule: '!self.startsWith(''/'')'
                      region:
                        default: auto
                        description: Region supplies the S3 signing region.
                        type: string
                      tls:
                        description: TLS customizes certificate verification for this
                          endpoint.
                        properties:
                          caSecretRef:
                            description: SecretKeySelector selects a key of a Secret.
                            properties:
                              key:
                                description: The key of the secret to select from.  Must
                                  be a valid secret key.
                                type: string
                              name:
                                default: ""
                                description: |-
                                  Name of the referent.
                                  This field is effectively required, but due to backwards compatibility is
                                  allowed to be empty. Instances of this type with an empty value here are
                                  almost certainly wrong.
                                  More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                type: string
                              optional:
                                description: Specify whether the Secret or its key
                                  must be defined
                                type: boolean
                            required:
                            - key
                            type: object
                            x-kubernetes-map-type: atomic
                          insecureSkipVerify:
                            default: false
                            type: boolean
                        type: object
                    required:
                    - bucket
                    type: object
                    x-kubernetes-validations:
                    - message: endpointURL or a credentials Secret carrying S3_ENDPOINT_URL
                        is required
                      rule: has(self.endpointURL) || has(self.credentialsSecretRef)
                  publicURL:
                    description: PublicURL is informational and is embedded in the
                      published pointer.
                    type: string
                required:
                - key
                - objectStorage
                type: object
              verifyInterval:
                default: 1h
                description: VerifyInterval controls checks for a missing or changed
                  pointer object.
                type: string
            required:
            - source
            - target
            type: object
          status:
            description: BackupPointerStatus records publication history and the current
              health conditions.
            properties:
              backups:
                description: BackupCounts exposes unsuccessful and unfinished backups
                  alongside successful ones.
                properties:
                  failed:
                    format: int32
                    type: integer
                  running:
                    format: int32
                    type: integer
                  starting:
                    format: int32
                    type: integer
                  succeeded:
                    format: int32
                    type: integer
                type: object
              conditions:
                description: Conditions use BackupSelected, Published, Fresh, and
                  Ready with positive polarity.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              current:
                description: PublishedBackup records the backup represented by a published
                  pointer object.
                properties:
                  backupName:
                    type: string
                  completedAt:
                    format: date-time
                    type: string
                  destination:
                    type: string
                  etag:
                    type: string
                  publishedAt:
                    format: date-time
                    type: string
                  schemaVersion:
                    format: int32
                    type: integer
                  storageName:
                    type: string
                type: object
              nextVerifyTime:
                format: date-time
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: BackupPointerPhase summarizes selection, publication,
                  and freshness.
                enum:
                - Pending
                - Published
                - NoCandidate
                - Stale
                - Dangling
                - Error
                - Suspended
                type: string
              previous:
                description: PublishedBackup records the backup represented by a published
                  pointer object.
                properties:
                  backupName:
                    type: string
                  completedAt:
                    format: date-time
                    type: string
                  destination:
                    type: string
                  etag:
                    type: string
                  publishedAt:
                    format: date-time
                    type: string
                  schemaVersion:
                    format: int32
                    type: integer
                  storageName:
                    type: string
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
