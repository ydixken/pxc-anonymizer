# Task is the human/agent entrypoint; Kubebuilder owns the Makefile.
# Keeping orchestration here limits Makefile changes to scaffold integration.
# Go build and test tooling, including envtest setup, stays in Make.
version: "3"

set: [pipefail]

tasks:
  help:
    desc: List all tasks.
    aliases: [default]
    cmds:
      - task --list-all

  lint:
    desc: Check publication safety, YAML and Go.
    cmds:
      - ./hack/check-secrecy.sh
      - yamllint --strict .
      - ./hack/vendor-crds.sh --check
      - ./hack/sync-chart-crd.sh --check
      - ./hack/sync-chart-rbac.sh --check
      - ./hack/check-chart-rbac.sh
      - actionlint
      - make lint

  test:
    desc: Run Go tests, including build configuration checks.
    cmds:
      - make test

  e2e:
    desc: Publish and read one BackupPointer on an explicitly selected development context.
    cmds:
      - python3 hack/smoke-backuppointer.py {{.CLI_ARGS}}

  docs:generate:
    desc: Regenerate the five-resource API reference with the pinned generator.
    cmds:
      - |
        set -eu
        docs_tmp="$(mktemp -d "${TMPDIR:-/tmp}/pxc-api-docs.XXXXXX")"
        trap 'rm -rf "$docs_tmp"' EXIT
        go run github.com/elastic/crd-ref-docs@v0.3.0 --source-path=api/v1alpha1 \
          --config=hack/crd-ref-docs.yaml --renderer=markdown --output-path="$docs_tmp/api.md"
        test -s "$docs_tmp/api.md"
        for kind in BackupPointer AnonymizationPolicy AnonymizationRun AnonymizationSchedule Bootstrap; do
          grep -Fxq "#### $kind" "$docs_tmp/api.md"
        done
        printf '%s\n\n%s\n' '<!-- Code generated by task docs:generate using crd-ref-docs v0.3.0. DO NOT EDIT. -->' \
          "$(cat "$docs_tmp/api.md")" > "$docs_tmp/marked-api.md"
        mv "$docs_tmp/marked-api.md" docs/reference/api.md

  docs:
    desc: Generate the API reference and build documentation with strict link validation.
    cmds:
      - task: docs:generate
      - ./hack/check-docs-links.sh
