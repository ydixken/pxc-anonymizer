# Task is the human/agent entrypoint; Kubebuilder owns the Makefile.
# Keeping orchestration here limits Makefile changes to scaffold integration.
# Go build and test tooling, including envtest setup, stays in Make.
version: "3"

set: [pipefail]

tasks:
  help:
    desc: List all tasks.
    aliases: [default]
    cmds:
      - task --list-all

  lint:
    desc: Check publication safety, YAML and Go.
    cmds:
      - ./hack/check-secrecy.sh
      - yamllint --strict .
      - ./hack/sync-chart-crd.sh --check
      - ./hack/sync-chart-rbac.sh --check
      - ./hack/check-chart-rbac.sh
      - actionlint
      - make lint

  test:
    desc: Run Go tests, including build configuration checks.
    cmds:
      - make test

  e2e:
    desc: Publish and read one BackupPointer on an explicitly selected development context.
    cmds:
      - python3 hack/smoke-backuppointer.py {{.CLI_ARGS}}
