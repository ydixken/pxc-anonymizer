---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
- apiGroups:
  - pxc-anonymizer.io
  resources:
  - backuppointers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - pxc-anonymizer.io
  resources:
  - backuppointers/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - pxc.percona.com
  resources:
  - perconaxtradbclusterbackups
  verbs:
  - get
  - list
  - watch
