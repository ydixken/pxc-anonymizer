# This rule is not used by the project pxc-anonymizer itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to pxc-anonymizer.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: pxc-anonymizer
    app.kubernetes.io/managed-by: kustomize
  name: anonymizationpolicy-viewer-role
rules:
- apiGroups:
  - pxc-anonymizer.io
  resources:
  - anonymizationpolicies
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - pxc-anonymizer.io
  resources:
  - anonymizationpolicies/status
  verbs:
  - get
