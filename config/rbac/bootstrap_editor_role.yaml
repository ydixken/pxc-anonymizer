# This rule is not used by the project pxc-anonymizer itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the pxc-anonymizer.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: pxc-anonymizer
    app.kubernetes.io/managed-by: kustomize
  name: bootstrap-editor-role
rules:
- apiGroups:
  - pxc-anonymizer.io
  resources:
  - bootstraps
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - pxc-anonymizer.io
  resources:
  - bootstraps/status
  verbs:
  - get
