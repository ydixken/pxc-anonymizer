extends: default

ignore:
  - tasks/
  # Generators own the formatting of these outputs.
  - config/
  - bin/
  - dist/
  - site/
  # Helm renders these files before validating their YAML.
  - charts/*/templates/

rules:
  document-start:
    present: false
  line-length:
    max: 140
  truthy:
    check-keys: false
